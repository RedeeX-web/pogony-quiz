<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Military Trainer</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <button class="burger-btn" id="burger-trigger" onclick="toggleMenu()">
            <img src="img/burger-bar.png" alt="burger bar" />
        </button>

        <div id="side-menu" class="side-menu">
            <div class="menu-content">
                <div class="menu-header"></div>
                <button class="menu-item" onclick="selectCategoryMenu('ranks')">
                    Погоны
                </button>
                <button
                    class="menu-item"
                    onclick="selectCategoryMenu('emblems')"
                >
                    Эмблемы
                </button>
                <button class="menu-item highlight" onclick="showHints()">
                    База знаний
                </button>
            </div>
        </div>

        <div id="timer" style="font-size: 40px">00:00</div>

        <div class="container" id="main-container">
            <div class="category-btns">
                <button
                    id="cat-ranks"
                    class="btn-category active"
                    onclick="setCategory('ranks')"
                >
                    Погоны
                </button>
                <button
                    id="cat-emblems"
                    class="btn-category"
                    onclick="setCategory('emblems')"
                >
                    Эмблемы
                </button>
                <button class="btn-category desktop-hint" onclick="showHints()">
                    Подсказки
                </button>
            </div>

            <div class="menu-btns">
                <button
                    id="trainMode"
                    class="btn-mode active"
                    onclick="setMode('train')"
                >
                    Учения
                </button>
                <button
                    id="examMode"
                    class="btn-mode"
                    onclick="setMode('exam')"
                >
                    Экзамен
                </button>
            </div>

            <div id="start-zone">
                <button class="submit-btn start-op" onclick="startGame()">
                    Начать операцию
                </button>
                <p id="enterHint" class="enter-info">Enter — подтверждение</p>
            </div>

            <div id="game-zone" class="hidden">
                <div class="rank-card">
                    <img
                        id="pogon-display"
                        src=""
                        alt="Target"
                        class="pogon-img"
                    />
                    <input
                        id="answer-input"
                        type="text"
                        placeholder="Введите название..."
                        autocomplete="off"
                    />
                    <button
                        id="check-btn"
                        class="submit-btn"
                        onclick="checkAnswer()"
                    >
                        Подтвердить
                    </button>
                </div>
                <div id="feedback" class="feedback"></div>
                <div id="stats" class="stats"></div>
            </div>
        </div>

        <div id="hints-container" class="container hidden hints-wide">
            <button class="back-btn" onclick="closeHints()">Назад</button>
            <div id="hints-content"></div>
        </div>

        <footer class="footer" style="margin-top: 20px">
            <a id="contact-link" href="https://vk.ru/f_x_f_x">Обратная связь</a>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
