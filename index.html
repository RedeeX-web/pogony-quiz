<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Тренажёр званий ВС РФ</title>
        <style>
            :root {
                --bg-color: #002333;
                --card-bg: #deefe7;
                --primary: #ffffff;
                --accent: #159a9c;
                --text-secondary: #b4bec9;
                --radius: 20px;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background-color: var(--bg-color);
                color: var(--primary);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
            }

            #timer {
                font-size: 18px;
                font-weight: 600;
                color: var(--accent);
                margin-bottom: 15px;
                background: rgba(255, 255, 255, 0.1);
                padding: 5px 20px;
                border-radius: var(--radius);
            }

            .container {
                background-color: var(--card-bg);
                padding: 25px;
                border-radius: var(--radius);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
                width: 100%;
                max-width: 400px;
                text-align: center;
            }

            .menu-btns {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
            }

            button {
                flex: 1;
                padding: 12px;
                border: none;
                border-radius: var(--radius);
                cursor: pointer;
                font-weight: 600;
                transition: all 0.3s;
            }

            .btn-mode {
                background-color: var(--text-secondary);
                color: white;
            }

            .btn-mode.active {
                background-color: var(--accent);
            }

            .rank-card {
                margin: 20px 0;
            }

            .pogon-img {
                width: 120px;
                height: auto;
                margin-bottom: 20px;
                border-radius: 10px;
                background: #f0f0f0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            input[type="text"] {
                width: 100%;
                padding: 15px;
                box-sizing: border-box;
                border: 2px solid var(--bg-color);
                border-radius: var(--radius);
                margin-bottom: 15px;
                outline: none;
                font-size: 16px;
                transition: border-color 0.3s;
                color: #002333;
            }

            input[type="text"]:focus {
                border-color: var(--accent);
            }

            .submit-btn {
                background-color: var(--accent);
                color: white;
                width: 100%;
                font-size: 16px;
            }

            .start-screen-btn {
                background-color: var(--002333);
                background-color: #002333;
                color: white;
                padding: 20px;
                font-size: 18px;
            }

            .feedback {
                margin-top: 15px;
                font-weight: bold;
                min-height: 24px;
            }

            .stats {
                margin-top: 20px;
                font-size: 14px;
                color: var(--text-secondary);
            }

            .hidden {
                display: none;
            }

            /* Мобильная адаптация */
            @media (max-width: 480px) {
                body {
                    padding: 10px;
                    /* Предотвращаем зум при фокусе на инпутах в iOS */
                    font-size: 16px;
                }

                .container {
                    padding: 15px;
                    width: 90%;
                    max-width: none;
                }

                .pogon-img {
                    width: 80%; /* Чуть меньше для мелких экранов */
                }

                input[type="text"] {
                    padding: 12px;
                    font-size: 16px; /* Важно: минимум 16px, чтобы iPhone не "зумил" экран автоматически */
                }

                button {
                    padding: 10px;
                    font-weight: 300;
                    font-size: 20px;
                }

                .submit-btn {
                    font-size: 25px;
                }

                #timer {
                    font-size: 32px;
                }

                #enterHint {
                    visibility: hidden;
                }
            }
        </style>
    </head>
    <body>
        <div id="timer">00:00</div>

        <div class="container">
            <div class="menu-btns">
                <button
                    id="trainMode"
                    class="btn-mode active"
                    onclick="setMode('train')"
                >
                    Тренировка
                </button>
                <button
                    id="examMode"
                    class="btn-mode"
                    onclick="setMode('exam')"
                >
                    Экзамен
                </button>
            </div>

            <div id="start-zone">
                <button
                    class="submit-btn start-screen-btn"
                    onclick="startGame()"
                >
                    Начать тест
                </button>
                <p
                    id="enterHint"
                    style="color: #002333; font-size: 12px; margin-top: 10px"
                >
                    (или нажмите Enter)
                </p>
            </div>

            <div id="game-zone" class="hidden">
                <div class="rank-card">
                    <img
                        id="pogon-display"
                        src=""
                        alt="Погон"
                        class="pogon-img"
                    />
                    <input
                        id="answer-input"
                        type="text"
                        placeholder="Введите название..."
                        autocomplete="off"
                    />
                    <button
                        id="check-btn"
                        class="submit-btn"
                        onclick="checkAnswer()"
                    >
                        Проверить
                    </button>
                </div>
                <div id="feedback" class="feedback"></div>
                <div id="stats" class="stats"></div>
            </div>
        </div>

        <div>
            <a
                style="
                    text-decoration: none;
                    color: var(--accent);
                    font-size: 12px;
                    margin-top: 10px;
                "
                href="https://vk.ru/f_x_f_x"
                ><p>Обратная связь</p></a
            >
        </div>
        <script>
            const ranks = [
                { name: "Рядовой", img: "img/__0000_Рядовой.jpg" },
                { name: "Ефрейтор", img: "img/__0001_Ефрейтор.jpg" },
                { name: "Младший сержант", img: "img/__0002_Мл. Сержант.jpg" },
                { name: "Сержант", img: "img/__0003_Сержант.jpg" },
                { name: "Старший сержант", img: "img/__0004_Ст. сержант.jpg" },
                { name: "Старшина", img: "img/__0005_Старшина.jpg" },
                { name: "Прапорщик", img: "img/__0006_Прапорщик.jpg" },
                {
                    name: "Старший прапорщик",
                    img: "img/__0007_Ст. Прапорщик.jpg",
                },
                {
                    name: "Младший лейтенант",
                    img: "img/__0008_Мл. Лейтенант.jpg",
                },
                { name: "Лейтенант", img: "img/__0009_Лейтенант.jpg" },
                {
                    name: "Старший лейтенант",
                    img: "img/__0010_Ст. Лейтенант.jpg",
                },
                { name: "Капитан", img: "img/__0011_Капитан.jpg" },
                { name: "Майор", img: "img/__0012_Майор.jpg" },
                { name: "Подполковник", img: "img/__0013_Подполковник.jpg" },
                { name: "Полковник", img: "img/__0014_Полковник.jpg" },
                { name: "Генерал Майор", img: "img/__0015_Ген. Майор.jpg" },
                {
                    name: "Генерал Лейтенант",
                    img: "img/__0016_Ген. Лейтенант.jpg",
                },
                {
                    name: "Генерал Полковник",
                    img: "img/__0017_Ген. Полковник.jpg",
                },
                { name: "Генерал армии", img: "img/__0018_Ген. Армии.jpg" },
                { name: "Маршал", img: "img/__0019_Маршал.jpg" },
            ];

            let currentMode = "train";
            let currentIndex = 0;
            let score = 0;
            let examList = [];
            let isFirstAttempt = true;
            let isGameActive = false;

            let timerInterval;
            let seconds = 0;

            const startZone = document.getElementById("start-zone");
            const gameZone = document.getElementById("game-zone");
            const input = document.getElementById("answer-input");
            const feedback = document.getElementById("feedback");
            const stats = document.getElementById("stats");
            const imgDisplay = document.getElementById("pogon-display");
            const timerDisplay = document.getElementById("timer");

            function normalize(text) {
                return text
                    .toLowerCase()
                    .trim()
                    .replace(/мл\./g, "младший")
                    .replace(/ст\./g, "старший")
                    .replace(/ген\./g, "генерал")
                    .split(/\s+/)
                    .map((word) => {
                        if (word === "мл") return "младший";
                        if (word === "ст") return "старший";
                        if (word === "ген") return "генерал";
                        return word;
                    })
                    .join("")
                    .replace(/\s+/g, "");
            }

            function startTimer() {
                clearInterval(timerInterval);
                seconds = 0;
                timerDisplay.innerText = "00:00";
                timerInterval = setInterval(() => {
                    seconds++;
                    let mins = Math.floor(seconds / 60);
                    let secs = seconds % 60;
                    timerDisplay.innerText =
                        (mins < 10 ? "0" + mins : mins) +
                        ":" +
                        (secs < 10 ? "0" + secs : secs);
                }, 1000);
            }

            function setMode(mode) {
                currentMode = mode;
                document
                    .getElementById("trainMode")
                    .classList.toggle("active", mode === "train");
                document
                    .getElementById("examMode")
                    .classList.toggle("active", mode === "exam");
                resetToStart();
            }

            function resetToStart() {
                isGameActive = false;
                clearInterval(timerInterval);
                timerDisplay.innerText = "00:00";
                startZone.classList.remove("hidden");
                gameZone.classList.add("hidden");
                feedback.innerText = "";
            }

            function startGame() {
                isGameActive = true;
                score = 0;
                currentIndex = 0;
                isFirstAttempt = true;

                startZone.classList.add("hidden");
                gameZone.classList.remove("hidden");

                input.value = "";
                feedback.innerText = "";

                if (currentMode === "exam") {
                    examList = [...ranks].sort(() => Math.random() - 0.5);
                } else {
                    examList = [...ranks];
                }

                updateCard();
                startTimer();
                setTimeout(() => input.focus(), 10);
            }

            function updateCard() {
                if (currentIndex < examList.length) {
                    imgDisplay.src = examList[currentIndex].img;
                    stats.innerText = `Вопрос ${currentIndex + 1} из ${examList.length}`;
                    isFirstAttempt = true;
                } else {
                    finishGame();
                }
            }

            function checkAnswer() {
                const userAns = normalize(input.value);
                const correctAns = normalize(examList[currentIndex].name);

                if (userAns === correctAns) {
                    if (isFirstAttempt) score++;
                    feedback.style.color = "#159A9C";
                    feedback.innerText = "Правильно!";
                    nextQuestion();
                } else {
                    feedback.style.color = "#d9534f";
                    isFirstAttempt = false;

                    if (currentMode === "train") {
                        feedback.innerText = "Неверно, попробуй еще раз";
                        input.value = "";
                    } else {
                        feedback.innerText = "Неверно";
                        setTimeout(nextQuestion, 600);
                    }
                }
            }

            function nextQuestion() {
                currentIndex++;
                input.value = "";
                feedback.innerText = "";
                updateCard();
                input.focus();
            }

            function finishGame() {
                isGameActive = false;
                clearInterval(timerInterval);
                gameZone.classList.add("hidden");
                startZone.classList.remove("hidden");

                // Обновляем содержимое стартовой зоны
                startZone.innerHTML = `
                    <div style="color: #002333; margin-bottom: 20px;">
                        <h2 style="margin: 0;">Готово!</h2>
                        <p>Результат: ${score} из ${examList.length}</p>
                        <p>Время: ${timerDisplay.innerText}</p>
                    </div>
                    <button class="submit-btn start-screen-btn" onclick="startGame()">Начать заново</button>
                    <p id="enterHint" style="color: #002333; font-size: 12px; margin-top: 10px;">(или нажмите Enter)</p>
                `;
            }

            // Глобальный слушатель Enter
            document.addEventListener("keypress", (event) => {
                if (event.key === "Enter") {
                    if (!isGameActive) {
                        startGame();
                    } else {
                        checkAnswer();
                    }
                }
            });

            // Инициализация при загрузке
            resetToStart();
        </script>
    </body>
</html>
